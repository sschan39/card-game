<!DOCTYPE html>
<html lang="en"></html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-container">
    <h1>Multiplayer Card Game</h1>
    <button id="create-room">Create New Room</button>
    <input type="text" id="room-id-input" placeholder="Enter Room ID to join">
    <button id="join-room">Join Room</button>
    <button id="rejoin-room">Rejoin Room</button>
  </div>
    <div id="game-container">
        <!-- First column -->
        <div id="first-column">
          <div id="room-info">
            <p>Your Room ID: <span id="room-id"></span></p>
            <p>Your ID: <span id="player-id"></span></p>
          </div>
          <div id="opponent-info">
            <div id="opponent-health">20</div>
            <button id="opponentHand-button">Hand</button>
            <button id="opponentExile-button">Exile</button>
            <button id="opponentGraveyard-button">Graveyard</button>
            <button id="opponentDeck-button">Deck</button>
          </div>
          <div id="card-info">card-info</div>
          <div id="player-info">
            <div id="turn-indicator"></div>
            <button id="playerHand-button">Hand</button>
            <button id="playerExile-button">Exile</button>
            <button id="playerGraveyard-button">Graveyard</button>
            <button id="playerDeck-button">Deck</button>
            <div id="player-health">20</div>
          </div>
          <div id="buttons">
            <button id="back">Back</button>
            <button id="leave-room">Leave Room</button>
            <button id="draw-card">Draw Card</button>
            <button id="end-turn">End Turn</button>
          </div>
        </div>
      
        <!-- Second column -->
        <div id="second-column">
          <div id="opponentDeck">opponent-deck<div id="opponentDeck-cards"></div></div>
          <div id="opponentGraveyard">opponent-graveyard<div id="opponentGraveyard-cards"></div></div>
          <div id="opponentExile">opponent-exile<div id="opponentExile-cards"></div></div>
          <div id="opponentHand">opponent-hand<div id="opponentHand-cards"></div></div>
          <div id="playmat-container">
            <div id="opponent-playmat">
              <div id="opponent-lands">Artifacts & Lands</div>
              <div id="opponent-creatures">Creatures</div>
            </div>
            <div id="playmat">
              <div id="creatures">Creatures</div>
              <div id="lands">Artifacts & Lands</div>
            </div>
          </div>
          <div id="playerHand">player-hand<div id="playerHand-cards"></div></div>
          <div id="playerExile">player-exile<div id="playerExile-cards"></div></div>
          <div id="playerGraveyard">player-graveyard<div id="playerGraveyard-cards"></div></div>
          <div id="playerDeck">player-deck<div id="playerDeck-cards"></div></div>
        </div>
      
        <!-- Third column -->
        <div id="third-column">
          <div id="log">log</div>
        </div>
    </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="socket.js"></script>
  <script src="room.js"></script>
  <script src="game.js"></script>
</body>
</html>
