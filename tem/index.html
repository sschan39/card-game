<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-container">
    <h1>Multiplayer Card Game</h1>
    <button id="create-room">Create New Room</button>
    <input type="text" id="room-id-input" placeholder="Enter Room ID to join">
    <button id="join-room">Join Room</button>
    <button id="rejoin-room">Rejoin Room</button>
  </div>

  <div id="game-container">
    <!--<h1>Multiplayer Card Game</h1>-->
    <div id="first-column">
      <div id="room-info">
        <p>Your Room ID: <span id="room-id"></span></p>
        <p>Your ID: <span id="player-id"></span></p>
      </div>
      <div id="card-info">card-info</div>
      <div id='buttons'>
        <button id="back">Back</button>
        <button id="leave-room">Leave Room</button>
        <button id="draw-card">Draw Card</button>
        <button id="end-turn">End Turn</button>
      </div>
    </div>
    <div id="second-column">
      <div id="opponent-hand">
        <h2>Opponent's Hand</h2>
        <div id="opponent-hand-cards"></div>
      </div>
      <div class="playmat-container">
        <!-- Opponent's Playmat (Upside Down) -->
        <div class="playmat opponent-playmat">
          <div class="section enchants">Enchants</div>
          <div class="section creatures">Creatures</div>
          <div class="section library">Library</div>
          <div class="section artifacts">Artifacts & Lands</div>
          <div class="section graveyard">Graveyard</div>
          <div class="section command-zone">Command Zone</div>
          <div class="section exile">Exile</div>
        </div>
        <!-- Player's Playmat (Bottom Half) -->
        <div class="playmat">
          <div class="section enchants">Enchants</div>
          <div class="section creatures">Creatures</div>
          <div class="section library">Library</div>
          <div class="section artifacts">Artifacts & Lands</div>
          <div class="section graveyard">Graveyard</div>
          <div class="section command-zone">Command Zone</div>
          <div class="section exile">Exile</div>
        </div>
      </div>
      <div id="player-hand">
        <h2>Your Hand</h2>
        <div id="hand"></div>
      </div>
    </div>
    <div class="third-column">
      <div id="log">
        <div id="log-entries">log</div>
        <div id='turn-indicator'>ARRR</div>
      </div>
  </div>

  <!--<script src="/socket.io/socket.io.js"></script>
  <script src="socket.js"></script>
  <script src="room.js"></script>
  <script src="game.js"></script>-->
</body>
</html>
